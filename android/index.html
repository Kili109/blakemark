<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#171522" />
    <title>Blakemark</title>
    <script>
      try {
        var saved = JSON.parse(localStorage.getItem("blakemark-settings") || "{}");
        if (saved.defaultsRev !== 3) {
          saved = {
            theme: "dark",
            links: "here",
            axes: true,
            contrastDark: 50,
            contrastLight: 50,
            contrastLightScale: 2,
            defaultsRev: 3
          };
          localStorage.setItem("blakemark-settings", JSON.stringify(saved));
        }
        var light = saved.theme === "light";
        if (light) document.documentElement.dataset.theme = "light";
        var amount = Math.max(0, Math.min(100, Number(light ? saved.contrastLight : saved.contrastDark) || 0)) / 100;
        var ends = light
          ? [["#f3eefb", "#fbfafe"], ["#fffbff", "#fffeff"], ["#e7e0f3", "#f6f3fb"], ["#5a547a", "#151320"], ["#8d86a8", "#3e3b50"], ["#ddd6ec", "#c4bad6"]]
          : [["#171522", "#07060c"], ["#221f30", "#100e18"], ["#2e2a40", "#1a1628"], ["#f6f1fb", "#ffffff"], ["#b7adc9", "#ece6f6"], ["#3c3652", "#625a7c"]];
        var names = ["--color-bg", "--color-surface", "--color-raised", "--color-fg", "--color-muted", "--color-line"];
        function mix(from, to) {
          var a = parseInt(from.slice(1), 16);
          var b = parseInt(to.slice(1), 16);
          var hex = "";
          for (var shift = 16; shift >= 0; shift -= 8) {
            var start = (a >> shift) & 255;
            var end = (b >> shift) & 255;
            hex += Math.round(start + (end - start) * amount).toString(16).padStart(2, "0");
          }
          return "#" + hex;
        }
        for (var i = 0; i < names.length; i++) {
          document.documentElement.style.setProperty(names[i], mix(ends[i][0], ends[i][1]));
        }
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", mix(ends[0][0], ends[0][1]));
      } catch (e) {}
    </script>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
